workflows:
  spesapp-debug:
    name: SpesApp Debug APK
    max_build_duration: 30
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build debug APK
        script: |
          flutter build apk \
            --dart-define=LLM_API_KEY="$LLM_API_KEY" \
            --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - francescogiliberto03@gmail.com